name: "Check with Sonarcloud"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: schulportal-testautomatisierung-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/check-nest-test-sonarcloud.yaml@ac540af7a37263a102c7bc6c8c9447a7b176f027 # 8.6.0
    with:
      node_version: '18'
      skip_tests: true
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
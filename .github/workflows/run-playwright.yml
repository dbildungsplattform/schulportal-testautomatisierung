name: Run Playwright Tests
run-name: Test ${{ inputs.frontendHostname }} with ${{ inputs.browser }} and ${{ inputs.tag }} from ${{ inputs.playwright_branch }}

on:
  # --------------------------
  # Reusable workflow trigger
  # --------------------------
  workflow_call:
    secrets:
      SPSH_DEV_USER_SSHKEY:
        description: 'SSH Key for Tunnel User to access LDAP tunnel (required for dev tests)'
        required: false
      SPSH_DEV_KUBECONFIG:
        description: 'Kubeconfig for SPSH development environment (required for dev tests)'
        required: false
      SPSH_DEV_TUNNEL_USERNAME:
        description: 'Username for SSH tunnel (required for dev tests)'
        required: false
      SPSH_DEV_TUNNEL_HOST:
        description: 'Hostname of the SSH tunnel (required for dev tests)'
        required: false
      SPSH_DEV_TUNNEL_PORT:
        description: 'Port of the SSH tunnel (required for dev tests)'
        required: false
      USER:
        description: 'Username for the application'
        required: true
      PW:
        description: 'Password for the application'
        required: true
      OTP_SEED_B32:
        description: 'Base32 encoded OTP seed for 2FA (required for stage tests with 2FA)'
        required: false
      RC_WEBHOOK:
        description: 'Webhook URL for notifications'
        required: true

    inputs:
      frontendHostname:
        type: string
        description: 'Hostname of the frontend server'
        required: true
        default: 'main.dev.spsh.dbildungsplattform.de'
      namespace_to_use:
        type: string
        description: 'Namespace to use for LDAP testing (should match hostname)'
        required: false
        default: 'main'
      tag:
        type: string
        description: 'Select which tests are run'
        required: true
        default: 'dev'
      browser:
        type: string
        description: 'Select which browser to use for testing'
        required: true
        default: 'chromium'
      playwright_branch:
        type: string
        description: 'The branch to take Playwright-tests from.'
        required: false
        default: main
      send_notifications:
        type: boolean
        description: 'Whether to send notifications to Rocket.Chat (defaults to false)'
        required: false

  # --------------------------
  # Manual trigger
  # --------------------------
  workflow_dispatch:
    inputs:
      frontendHostname:
        type: string
        description: 'Hostname of the frontend server'
        required: true
        default: 'main.dev.spsh.dbildungsplattform.de'
      namespace_to_use:
        type: string
        description: 'Namespace to use for LDAP testing (should match hostname)'
        required: false
        default: 'main'
      tag:
        description: 'Select which tests are run'
        required: true
        default: 'dev'
        type: choice
        options:
          - stage-smoke
          - dev
          - stage
      browser:
        description: 'Select which browser to use for testing'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - chrome
          - firefox
          - webkit
          - msedge
      playwright_branch:
        type: string
        description: 'The branch to take Playwright-tests from.'
        required: false
        default: main

# --------------------------
# Concurrency — queue per host, no cancellation
# --------------------------
concurrency:
  group: ${{ inputs.frontendHostname }}
  cancel-in-progress: false
  queue: max

jobs:
  # --------------------------
  # Sharded Playwright test runs
  # --------------------------
  playwright_shards:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      # --------------------------
      # Checkout & Node setup
      # --------------------------
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          repository: 'dBildungsplattform/schulportal-testautomatisierung'
          ref: ${{ inputs.playwright_branch }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 22

      - name: Remove Microsoft APT and Update Packages
        run: |
          sudo rm /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update || true

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: Lint check
        run: npm run lint:ci

      - name: Prettier check
        run: npm run check-format

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # --------------------------
      # SSH agent (dev only)
      # --------------------------
      - name: Setup SSH agent
        if: ${{ inputs.tag == 'dev' }}
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387
        with:
          ssh-private-key: ${{ secrets.SPSH_DEV_USER_SSHKEY }}

      # --------------------------
      # Kubeconfig (dev only)
      # --------------------------
      - name: Add kubeconfig
        if: ${{ inputs.tag == 'dev' }}
        env:
          KUBECONFIG_CONTENT: ${{ secrets.SPSH_DEV_KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config

      # --------------------------
      # LDAP setup (dev only)
      # --------------------------
      - name: Get LDAP Pod IP
        if: ${{ inputs.tag == 'dev' }}
        env:
          NS: ${{ inputs.namespace_to_use }}
        run: |
          POD_IP=$(kubectl get pod dbildungs-iam-ldap-0 -n "$NS" -o=jsonpath='{.status.podIP}')
          echo "LDAP_POD_IP=$POD_IP" >> $GITHUB_ENV

      - name: Get LDAP admin credentials from Kubernetes
        if: ${{ inputs.tag == 'dev' }}
        env:
          NS: ${{ inputs.namespace_to_use }}
        run: |
          LDAP_ADMIN_USER=$(kubectl -n "$NS" get secret dbildungs-iam-server -o jsonpath='{.data.ldap-bind-dn}' | base64 -d)
          echo "::add-mask::$LDAP_ADMIN_USER"
          echo "LDAP_ADMIN_USER=$LDAP_ADMIN_USER" >> $GITHUB_ENV

          LDAP_ADMIN_PASSWORD=$(kubectl -n "$NS" get secret dbildungs-iam-server -o jsonpath='{.data.ldap-admin-password}' | base64 -d)
          echo "::add-mask::$LDAP_ADMIN_PASSWORD"
          echo "LDAP_ADMIN_PASSWORD=$LDAP_ADMIN_PASSWORD" >> $GITHUB_ENV

      - name: Create SSH tunnel to LDAP
        if: ${{ inputs.tag == 'dev' }}
        env:
          SPSH_DEV_TUNNEL_USERNAME: ${{ secrets.SPSH_DEV_TUNNEL_USERNAME }}
          SPSH_DEV_TUNNEL_HOST: ${{ secrets.SPSH_DEV_TUNNEL_HOST }}
          SPSH_DEV_TUNNEL_PORT: ${{ secrets.SPSH_DEV_TUNNEL_PORT }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -L 1389:$LDAP_POD_IP:3389 $SPSH_DEV_TUNNEL_USERNAME@$SPSH_DEV_TUNNEL_HOST \
              -p $SPSH_DEV_TUNNEL_PORT \
              -N -o ServerAliveInterval=15 -o ExitOnForwardFailure=yes &
          disown

      - name: Install ldap-utils
        if: ${{ inputs.tag == 'dev' }}
        run: sudo apt-get install -y ldap-utils

      - name: Test LDAP Connectivity
        if: ${{ inputs.tag == 'dev' }}
        run: ldapwhoami -x -H ldap://localhost:1389 -D "$LDAP_ADMIN_USER" -w "$LDAP_ADMIN_PASSWORD"

      # --------------------------
      # Run Playwright tests (SHARDED)
      # --------------------------
      - name: Run Playwright tests
        env:
          FRONTEND_URL: 'https://${{ inputs.frontendHostname }}/'
          TAG: ${{ inputs.tag }}
          BROWSER: ${{ inputs.browser }}
          USER: '${{ secrets.USER }}'
          PW: '${{ secrets.PW }}'
          OTP_SEED_B32: '${{ secrets.OTP_SEED_B32 }}'
          LDAP_URL: ldap://localhost:1389
          LDAP_ADMIN_USER: ${{ env.LDAP_ADMIN_USER }}
          LDAP_ADMIN_PASSWORD: ${{ env.LDAP_ADMIN_PASSWORD }}
          NODE_OPTIONS: --no-experimental-strip-types
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          npx playwright test \
            --config=playwright.config.ts \
            --grep @"$TAG" \
            --project "$BROWSER" \
            --shard=${{ matrix.shard }}/3

      # --------------------------
      # Upload reports (per shard)
      # --------------------------
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      # --------------------------
      # Notifications (only on failure)
      # --------------------------
      - uses: RocketChat/Rocket.Chat.GitHub.Action.Notification@2966f5f2e0313a94f965a51c08700cfecf0b6572
        if: ${{ inputs.send_notifications && failure() }}
        with:
          type: ${{ job.status }}
          job_name: 'Playwright Job Status: '
          url: ${{ secrets.RC_WEBHOOK }}
          channel: '#SPSH-Test-Automation'
          username: Playwright Notificator

  # --------------------------
  # Aggregator — satisfies required check
  # --------------------------
  run_playwright_tests: # <-- exact name GitHub expects
    if: always() # <-- run even if shards fail, to report failure properly
    needs: [playwright_shards]
    runs-on: ubuntu-latest
    steps:
      # --------------------------
      # Fail if any shard failed or was cancelled
      # --------------------------
      - name: All shards passed
        run: |
          if [ "${{ needs.playwright_shards.result }}" != "success" ]; then
            echo "One or more shards failed or were cancelled!"
            exit 1
          fi
